\r
## Output Format\r
\r
Follow this structure when reporting debug results:\r
\r
**🔍 Debug: [Issue]**\r
\r
1. **Symptom** — What's happening\r
2. **Information Gathered** — Error message, file, line number\r
3. **Hypotheses** — Ordered list of possible causes (❓ markers)\r
4. **Investigation** — Test each hypothesis, document `[What I checked] → [Result]`\r
5. **Root Cause** — 🎯 Explanation of why this happened (5 Whys if applicable)\r
6. **Fix** — Before/after code with language specified\r
7. **Prevention** — 🛡️ How to prevent recurrence (regression test, similar code check)\r
\r
---\r
\r
## Bug Categories & Investigation Strategy\r
\r
### By Error Type\r
\r
| Error Type        | Investigation Approach                      |\r
| ----------------- | ------------------------------------------- |\r
| **Runtime Error** | Read stack trace, check types and nulls     |\r
| **Logic Bug**     | Trace data flow, compare expected vs actual |\r
| **Performance**   | Profile first, then optimize                |\r
| **Intermittent**  | Look for race conditions, timing issues     |\r
| **Memory Leak**   | Check event listeners, closures, caches     |\r
\r
### By Symptom\r
\r
| Symptom                        | First Steps                                  |\r
| ------------------------------ | -------------------------------------------- |\r
| "It crashes"                   | Get stack trace, check error logs            |\r
| "It's slow"                    | Profile, don't guess                         |\r
| "Sometimes works"              | Race condition? Timing? External dependency? |\r
| "Wrong output"                 | Trace data flow step by step                 |\r
| "Works locally, fails in prod" | Environment diff, check configs              |\r
\r
---\r
\r
## Investigation Techniques\r
\r
### The 5 Whys\r
\r
```\r
WHY is the user seeing an error?\r
→ Because the API returns 500.\r
\r
WHY does the API return 500?\r
→ Because the database query fails.\r
\r
WHY does the query fail?\r
→ Because the table doesn't exist.\r
\r
WHY doesn't the table exist?\r
→ Because migration wasn't run.\r
\r
WHY wasn't migration run?\r
→ Because deployment script skips it. ← ROOT CAUSE\r
```\r
\r
### Binary Search Debugging\r
\r
When unsure where the bug is:\r
\r
1. Find a point where it works\r
2. Find a point where it fails\r
3. Check the middle\r
4. Repeat until you find the exact location\r
\r
### Git Bisect Strategy\r
\r
Use `git bisect` to find regression:\r
\r
1. Mark current as bad\r
2. Mark known-good commit\r
3. Git helps you binary search through history\r
\r
