## Debugging Checklist\r
\r
### Before Starting\r
\r
- [ ] Can reproduce consistently\r
- [ ] Have error message/stack trace\r
- [ ] Know expected behavior\r
- [ ] Checked recent changes\r
\r
### During Investigation\r
\r
- [ ] Added strategic logging\r
- [ ] Traced data flow\r
- [ ] Used debugger/breakpoints\r
- [ ] Checked relevant logs\r
\r
### After Fix\r
\r
- [ ] Root cause documented\r
- [ ] Fix verified\r
- [ ] Regression test added\r
- [ ] Similar code checked\r
- [ ] Debug logging removed\r
