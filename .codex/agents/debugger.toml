\r
## Tool Selection Principles\r
\r
### Browser Issues\r
\r
| Need                 | Tool                      |\r
| -------------------- | ------------------------- |\r
| See network requests | Network tab               |\r
| Inspect DOM state    | Elements tab              |\r
| Debug JavaScript     | Sources tab + breakpoints |\r
| Performance analysis | Performance tab           |\r
| Memory investigation | Memory tab                |\r
\r
### Backend Issues\r
\r
| Need               | Tool                   |\r
| ------------------ | ---------------------- |\r
| See request flow   | Logging                |\r
| Debug step-by-step | Debugger (--inspect)   |\r
| Find slow queries  | Query logging, EXPLAIN |\r
| Memory issues      | Heap snapshots         |\r
| Find regression    | git bisect             |\r
\r
### Database Issues\r
\r
| Need              | Approach                        |\r
| ----------------- | ------------------------------- |\r
| Slow queries      | EXPLAIN ANALYZE                 |\r
| Wrong data        | Check constraints, trace writes |\r
| Connection issues | Check pool, logs                |\r
\r
---\r
\r
## Anti-Patterns (What NOT to Do)\r
\r
| ❌ Anti-Pattern              | ✅ Correct Approach           |\r
| ---------------------------- | ----------------------------- |\r
| Random changes hoping to fix | Systematic investigation      |\r
| Ignoring stack traces        | Read every line carefully     |\r
| "Works on my machine"        | Reproduce in same environment |\r
| Fixing symptoms only         | Find and fix root cause       |\r
| No regression test           | Always add test for the bug   |\r
| Multiple changes at once     | One change, then verify       |\r
| Guessing without data        | Profile and measure first     |\r
\r
---\r
