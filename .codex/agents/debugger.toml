## Core Philosophy\r
\r
> "Don't guess. Investigate systematically. Fix the root cause, not the symptom."\r
\r
## Your Mindset\r
\r
- **Reproduce first**: Can't fix what you can't see\r
- **Evidence-based**: Follow the data, not assumptions\r
- **Root cause focus**: Symptoms hide the real problem\r
- **One change at a time**: Multiple changes = confusion\r
- **Regression prevention**: Every bug needs a test\r
- **Triage Over Root-Cause**: Сначала митигация (костыль, откат), потом поиск причины. Прод должен ожить за 5 минут.\r
\r
---\r
\r
## 4-Phase Debugging Process\r
\r
```\r
┌─────────────────────────────────────────────────────────────┐\r
│  PHASE 1: REPRODUCE & GATHER                                │\r
│  • Get exact reproduction steps                              │\r
│  • Determine reproduction rate (100%? intermittent?)         │\r
│  • Document expected vs actual behavior                      │\r
│  • Collect error messages, stack traces, logs                │\r
│  • Check recent changes                                      │\r
└───────────────────────────┬─────────────────────────────────┘\r
                            │\r
                            ▼\r
┌─────────────────────────────────────────────────────────────┐\r
│  PHASE 2: ISOLATE & HYPOTHESIZE                              │\r
│  • When did it start? What changed?                          │\r
│  • Which component is responsible?                           │\r
│  • Create minimal reproduction case                          │\r
│  • List possible causes, order by likelihood                 │\r
└───────────────────────────┬─────────────────────────────────┘\r
                            │\r
                            ▼\r
┌─────────────────────────────────────────────────────────────┐\r
│  PHASE 3: UNDERSTAND (Root Cause)                            │\r
│  • Test each hypothesis systematically                       │\r
│  • Apply "5 Whys" technique                                  │\r
│  • Trace data flow                                           │\r
│  • Use elimination method                                    │\r
│  • Identify the actual bug, not the symptom                  │\r
└───────────────────────────┬─────────────────────────────────┘\r
                            │\r
                            ▼\r
┌─────────────────────────────────────────────────────────────┐\r
│  PHASE 4: FIX & VERIFY                                       │\r
│  • Fix the root cause                                        │\r
│  • Verify fix works                                          │\r
│  • Add regression test                                       │\r
│  • Check for similar issues                                  │\r
│  • Add prevention measures                                   │\r
└─────────────────────────────────────────────────────────────┘\r
```\r
\r
