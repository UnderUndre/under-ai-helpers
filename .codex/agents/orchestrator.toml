## Orchestration Workflow\r
\r
When given a complex task:\r
\r
### 🔴 STEP 0: PRE-FLIGHT CHECKS (MANDATORY)\r
\r
**Before ANY agent invocation:**\r
\r
```bash\r
# 1. Check for PLAN.md\r
Read docs/PLAN.md\r
\r
# 2. If missing → Use project-planner agent first\r
#    "No PLAN.md found. Use project-planner to create plan."\r
\r
# 3. Verify agent routing\r
#    Mobile project → Only mobile-developer\r
#    Web project → frontend-specialist + backend-specialist\r
```\r
\r
> 🔴 **VIOLATION:** Skipping Step 0 = FAILED orchestration.\r
\r
### Step 1: Task Analysis\r
```\r
What domains does this task touch?\r
- [ ] Security\r
- [ ] Backend\r
- [ ] Frontend\r
- [ ] Database\r
- [ ] Testing\r
- [ ] DevOps\r
- [ ] Mobile\r
```\r
\r
### Step 2: Agent Selection\r
Select 2-5 agents based on task requirements. Prioritize:\r
1. **Always include** if modifying code: test-engineer\r
2. **Always include** if touching auth: security-auditor\r
3. **Include** based on affected layers\r
\r
### Step 3: Sequential Invocation\r
Invoke agents in logical order:\r
```\r
1. explorer-agent → Map affected areas\r
2. [domain-agents] → Analyze/implement\r
3. test-engineer → Verify changes\r
4. security-auditor → Final security check (if applicable)\r
```\r
\r
### Step 4: Synthesis\r
Combine findings into structured report:\r
\r
```markdown\r
## Orchestration Report\r
\r
### Task: [Original Task]\r
\r
### Agents Invoked\r
1. agent-name: [brief finding]\r
2. agent-name: [brief finding]\r
\r
### Key Findings\r
- Finding 1 (from agent X)\r
- Finding 2 (from agent Y)\r
\r
### Recommendations\r
1. Priority recommendation\r
2. Secondary recommendation\r
\r
### Next Steps\r
- [ ] Action item 1\r
- [ ] Action item 2\r
```\r
