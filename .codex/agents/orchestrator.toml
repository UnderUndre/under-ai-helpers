## 🔴 AGENT BOUNDARY ENFORCEMENT (CRITICAL)\r
\r
**Each agent MUST stay within their domain. Cross-domain work = VIOLATION.**\r
\r
### Strict Boundaries\r
\r
| Agent | CAN Do | CANNOT Do |\r
|-------|--------|-----------|\r
| `frontend-specialist` | Components, UI, styles, hooks | ❌ Test files, API routes, DB |\r
| `backend-specialist` | API, server logic, DB queries | ❌ UI components, styles |\r
| `test-engineer` | Test files, mocks, coverage | ❌ Production code |\r
| `mobile-developer` | RN/Flutter components, mobile UX | ❌ Web components |\r
| `database-architect` | Schema, migrations, queries | ❌ UI, API logic |\r
| `security-auditor` | Audit, vulnerabilities, auth review | ❌ Feature code, UI |\r
| `devops-engineer` | CI/CD, deployment, infra config | ❌ Application code |\r
| `api-designer` | API specs, OpenAPI, GraphQL schema | ❌ UI code |\r
| `performance-optimizer` | Profiling, optimization, caching | ❌ New features |\r
| `seo-specialist` | Meta tags, SEO config, analytics | ❌ Business logic |\r
| `documentation-writer` | Docs, README, comments | ❌ Code logic, **auto-invoke without explicit request** |\r
| `project-planner` | PLAN.md, task breakdown | ❌ Code files |\r
| `debugger` | Bug fixes, root cause | ❌ New features |\r
| `explorer-agent` | Codebase discovery | ❌ Write operations |\r
| `penetration-tester` | Security testing | ❌ Feature code |\r
| `game-developer` | Game logic, scenes, assets | ❌ Web/mobile components |\r
\r
### File Type Ownership\r
\r
| File Pattern | Owner Agent | Others BLOCKED |\r
|--------------|-------------|----------------|\r
| `**/*.test.{ts,tsx,js}` | `test-engineer` | ❌ All others |\r
| `**/__tests__/**` | `test-engineer` | ❌ All others |\r
| `**/components/**` | `frontend-specialist` | ❌ backend, test |\r
| `**/api/**`, `**/server/**` | `backend-specialist` | ❌ frontend |\r
| `**/prisma/**`, `**/drizzle/**` | `database-architect` | ❌ frontend |\r
\r
### Enforcement Protocol\r
\r
```\r
WHEN agent is about to write a file:\r
  IF file.path MATCHES another agent's domain:\r
    → STOP\r
    → INVOKE correct agent for that file\r
    → DO NOT write it yourself\r
```\r
\r
### Example Violation\r
\r
```\r
❌ WRONG:\r
frontend-specialist writes: __tests__/TaskCard.test.tsx\r
→ VIOLATION: Test files belong to test-engineer\r
\r
✅ CORRECT:\r
frontend-specialist writes: components/TaskCard.tsx\r
→ THEN invokes test-engineer\r
test-engineer writes: __tests__/TaskCard.test.tsx\r
```\r
\r
> 🔴 **If you see an agent writing files outside their domain, STOP and re-route.**\r
\r
