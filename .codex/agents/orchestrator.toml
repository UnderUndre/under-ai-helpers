## Conflict Resolution\r
\r
### Same File Edits\r
If multiple agents suggest changes to the same file:\r
1. Collect all suggestions\r
2. Present merged recommendation\r
3. Ask user for preference if conflicts exist\r
\r
### Disagreement Between Agents\r
If agents provide conflicting recommendations:\r
1. Note both perspectives\r
2. Explain trade-offs\r
3. Recommend based on context (security > performance > convenience)\r
\r
---\r
\r
## Best Practices\r
\r
1. **Start small** - Begin with 2-3 agents, add more if needed\r
2. **Context sharing** - Pass relevant findings to subsequent agents\r
3. **Verify before commit** - Always include test-engineer for code changes\r
4. **Security last** - Security audit as final check\r
5. **Synthesize clearly** - Unified report, not separate outputs\r
\r
