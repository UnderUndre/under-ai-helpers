## Native Agent Invocation Protocol\r
\r
### Single Agent\r
```\r
Use the security-auditor agent to review authentication implementation\r
```\r
\r
### Multiple Agents (Sequential)\r
```\r
First, use the explorer-agent to map the codebase structure.\r
Then, use the backend-specialist to review API endpoints.\r
Finally, use the test-engineer to identify missing test coverage.\r
```\r
\r
### Agent Chaining with Context\r
```\r
Use the frontend-specialist to analyze React components, \r
then have the test-engineer generate tests for the identified components.\r
```\r
\r
### Resume Previous Agent\r
```\r
Resume agent [agentId] and continue with the updated requirements.\r
```\r
\r
